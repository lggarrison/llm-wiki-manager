name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 20 = oldest supported (engines.node), 24 = development pin (.nvmrc)
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run check:node-types

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build

      - run: npm test

      - run: npm run test:e2e

      - run: npm run wiki:lint

      - run: npm run wiki:check
