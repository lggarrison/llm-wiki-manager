<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 596" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <!-- Terminal window -->
  <rect x="0" y="0" width="760" height="596" rx="10" fill="#1e222a"/>
  <rect x="0" y="0" width="760" height="34" rx="10" fill="#2c313a"/>
  <rect x="0" y="24" width="760" height="10" fill="#2c313a"/>
  <circle cx="22" cy="17" r="6" fill="#e06c75"/>
  <circle cx="42" cy="17" r="6" fill="#e5c07b"/>
  <circle cx="62" cy="17" r="6" fill="#98c379"/>
  <text x="380" y="21" text-anchor="middle" fill="#7f848e">my-app — llm-wiki-manager</text>

  <g fill="#abb2bf">
    <text x="24" y="62"><tspan fill="#98c379">$</tspan> npx llm-wiki-manager init</text>

    <text x="24" y="88"><tspan fill="#7f848e">┌</tspan>  <tspan fill="#56b6c2">llm-wiki-manager — wiki scaffold</tspan></text>
    <text x="24" y="108" fill="#7f848e">│</text>
    <text x="24" y="128"><tspan fill="#7f848e">◇</tspan>  Scaffolding wiki directory…</text>
    <text x="24" y="148"><tspan fill="#7f848e">│</tspan>  <tspan fill="#7f848e">Created: schema.md, AGENTS.md, index.md, log.md, raw/raw.md, README.md</tspan></text>
    <text x="24" y="168" fill="#7f848e">│</text>
    <text x="24" y="188"><tspan fill="#7f848e">◇</tspan>  Building index.md…</text>
    <text x="24" y="208"><tspan fill="#7f848e">│</tspan>  <tspan fill="#98c379">✓</tspan> <tspan fill="#7f848e">index.md written (2 page(s))</tspan></text>
    <text x="24" y="228" fill="#7f848e">│</text>
    <text x="24" y="248"><tspan fill="#7f848e">◇</tspan>  Adding npm scripts to package.json (wiki:lint, wiki:build, wiki:check, …)</text>
    <text x="24" y="268" fill="#7f848e">│</text>
    <text x="24" y="288"><tspan fill="#7f848e">◇</tspan>  Writing AGENTS.md…</text>
    <text x="24" y="308" fill="#7f848e">│</text>
    <text x="24" y="328"><tspan fill="#7f848e">└</tspan>  <tspan fill="#98c379">Done!</tspan> Next steps:</text>
    <text x="44" y="348">• Review <tspan fill="#e5c07b">wiki/schema.md</tspan> to understand wiki conventions</text>
    <text x="44" y="368">• Run <tspan fill="#e5c07b">npm run wiki:lint</tspan> to validate your wiki</text>
    <text x="44" y="388">• Run <tspan fill="#e5c07b">npm run wiki:help</tspan> for a list of wiki commands</text>

    <text x="24" y="428"><tspan fill="#98c379">$</tspan> npx llm-wiki-manager doctor</text>
    <text x="24" y="454"><tspan fill="#98c379">✓</tspan> install config found (.llm-wiki-manager.json)</text>
    <text x="24" y="474"><tspan fill="#98c379">✓</tspan> scaffold version matches package (v1.0.0)</text>
    <text x="24" y="494"><tspan fill="#98c379">✓</tspan> wiki meta files present in wiki/</text>
    <text x="24" y="514"><tspan fill="#98c379">✓</tspan> index.md is up to date</text>
    <text x="24" y="534"><tspan fill="#98c379">✓</tspan> package.json wiki:* scripts are in sync</text>
    <text x="24" y="562" fill="#98c379">No problems found.</text>
  </g>
