version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    target-branch: develop
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node majors track Node.js majors. `.nvmrc`, engines.node, and
      # @types/node are all aligned on Node 24+. Bump them together when upgrading.
      # Dependabot cannot read `.nvmrc`; CI runs `npm run check:node-types`.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    target-branch: develop
    commit-message:
      prefix: ci
      include: scope
