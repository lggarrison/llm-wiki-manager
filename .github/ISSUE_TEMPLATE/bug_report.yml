name: Bug report
description: Report a problem with the CLI or the scaffolded wiki tooling
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please do not use this form for security issues — see the [security policy](https://github.com/lggarrison/llm-wiki-manager/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran and, if possible, a minimal example.
      placeholder: |
        1. npx github:lggarrison/llm-wiki-manager init
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npx llm-wiki-manager --version` (or the commit/tag you installed).
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: e.g. v24.18.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 14, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >-
        Paste any error output or logs. If the CLI failed, re-run the command with the
        DEBUG environment variable set (e.g. `DEBUG=1 npx llm-wiki-manager upgrade`, or
        `$env:DEBUG=1` first on PowerShell) and paste the full stack trace.
      render: shell
