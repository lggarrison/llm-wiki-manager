<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="0" y="0" width="760" height="980" rx="10" fill="#1e222a"/>
  <rect x="0" y="0" width="760" height="34" rx="10" fill="#2c313a"/>
  <rect x="0" y="24" width="760" height="10" fill="#2c313a"/>
  <circle cx="22" cy="17" r="6" fill="#e06c75"/>
  <circle cx="42" cy="17" r="6" fill="#e5c07b"/>
  <circle cx="62" cy="17" r="6" fill="#98c379"/>
  <text x="380" y="21" text-anchor="middle" fill="#7f848e">my-app — llm-wiki-manager</text>

  <g fill="#abb2bf">
    <text x="24" y="62"><tspan fill="#98c379">$</tspan> npx llm-wiki-manager init</text>

    <text x="24" y="88"><tspan fill="#7f848e">┌</tspan>  <tspan fill="#56b6c2">llm-wiki-manager — wiki scaffold</tspan></text>
    <text x="24" y="108" fill="#7f848e">│</text>
    <text x="24" y="128"><tspan fill="#7f848e">◇</tspan>  Project name (used in AGENTS.md and schema.md)</text>
    <text x="24" y="148"><tspan fill="#7f848e">│</tspan>  my-app</text>
    <text x="24" y="168" fill="#7f848e">│</text>
    <text x="24" y="188"><tspan fill="#7f848e">◇</tspan>  Wiki directory name</text>
    <text x="24" y="208"><tspan fill="#7f848e">│</tspan>  wiki</text>
    <text x="24" y="228" fill="#7f848e">│</text>
    <text x="24" y="248"><tspan fill="#7f848e">◇</tspan>  Directories this wiki should document (comma-separated, e.g. src, api)</text>
    <text x="24" y="268"><tspan fill="#7f848e">│</tspan>  src</text>
    <text x="24" y="288" fill="#7f848e">│</text>
    <text x="24" y="308"><tspan fill="#7f848e">◇</tspan>  Scaffolding wiki directory…</text>
    <text x="24" y="328"><tspan fill="#7f848e">│</tspan>  <tspan fill="#7f848e">Created: .entity-scopes, AGENTS.md, index.md, log.md, raw/raw.md, README.md, schema.md</tspan></text>
    <text x="24" y="348" fill="#7f848e">│</text>
    <text x="24" y="368"><tspan fill="#7f848e">◇</tspan>  Building index.md…</text>
    <text x="24" y="388"><tspan fill="#7f848e">│</tspan>  <tspan fill="#98c379">✓</tspan> <tspan fill="#7f848e">index.md written (2 page(s))</tspan></text>
    <text x="24" y="408" fill="#7f848e">│</text>
    <text x="24" y="428"><tspan fill="#7f848e">◇</tspan>  Adding npm scripts to package.json (wiki:help, wiki:lint, wiki:build,</text>
    <text x="24" y="448"><tspan fill="#7f848e">│</tspan>  wiki:check, wiki:sync, wiki:log, wiki:doctor, wiki:setup:husky)…</text>
    <text x="24" y="468" fill="#7f848e">│</text>
    <text x="24" y="488"><tspan fill="#7f848e">◇</tspan>  Adding <tspan fill="#e5c07b">llm-wiki-manager</tspan> to devDependencies…</text>
    <text x="24" y="508" fill="#7f848e">│</text>
    <text x="24" y="528"><tspan fill="#7f848e">◇</tspan>  Writing AGENTS.md…</text>
    <text x="24" y="548" fill="#7f848e">│</text>
    <text x="24" y="568"><tspan fill="#7f848e">└</tspan>  <tspan fill="#98c379">Done!</tspan> Next steps:</text>
    <text x="44" y="588">• Review <tspan fill="#e5c07b">wiki/schema.md</tspan> to understand wiki conventions</text>
    <text x="44" y="608">• Run <tspan fill="#e5c07b">npm run wiki:help</tspan> for a list of wiki commands</text>
    <text x="44" y="628">• Run <tspan fill="#e5c07b">npm run wiki:lint</tspan> to validate your wiki</text>
    <text x="44" y="648">• Run <tspan fill="#e5c07b">npm run wiki:build</tspan> to regenerate index.md</text>
    <text x="44" y="668">• Run <tspan fill="#e5c07b">npm run wiki:doctor</tspan> to check scaffold health</text>
    <text x="44" y="688">• Open <tspan fill="#e5c07b">wiki/README.md</tspan> (human entry) and <tspan fill="#e5c07b">wiki/AGENTS.md</tspan> (agent entry)</text>
    <text x="44" y="708">• Optional git hooks (Husky + lint-staged) — see README "Optional git hooks"</text>
    <text x="44" y="728">          • <tspan fill="#e5c07b">npm run wiki:setup:husky</tspan> wires pre-push wiki:check</text>
    <text x="44" y="748">• Use <tspan fill="#e5c07b">npm run wiki:*</tspan> for wiki scripts (not <tspan fill="#e5c07b">npx run</tspan> — that is a different package)</text>
    <text x="44" y="768"><tspan fill="#e5c07b">Final Step:</tspan> <tspan fill="#e5c07b">npm install</tspan> — required before <tspan fill="#e5c07b">npm run wiki:*</tspan> works</text>

    <text x="24" y="808"><tspan fill="#98c379">$</tspan> npm install</text>
    <text x="24" y="838"><tspan fill="#98c379">$</tspan> npm run wiki:doctor</text>
    <text x="24" y="864" fill="#7f848e">llm-wiki-manager doctor — v1.0.2</text>
    <text x="24" y="890"><tspan fill="#98c379">✓</tspan> install config found (.llm-wiki-manager.json)</text>
    <text x="24" y="910"><tspan fill="#98c379">✓</tspan> scaffold version matches package (v1.0.2)</text>
    <text x="24" y="930"><tspan fill="#98c379">✓</tspan> wiki meta files present in wiki/</text>
    <text x="24" y="950"><tspan fill="#98c379">✓</tspan> index.md is up to date</text>
    <text x="24" y="970"><tspan fill="#98c379">No problems found.</tspan></text>
  </g>
</svg>
