name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write # Required for npm Trusted Publishing (OIDC)
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE 'origin/main$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main; releases must be cut from main"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm run release:check

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  sync-develop:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge main into develop
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout develop
          if git merge origin/main -m "chore: sync main into develop after ${{ github.ref_name }}"; then
            git push origin develop
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open sync PR on merge conflict
        if: steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SYNC_BRANCH="sync/main-after-${{ github.ref_name }}"
          git checkout -B "$SYNC_BRANCH" origin/main
          git push -f origin "$SYNC_BRANCH"
          gh pr create --base develop --head "$SYNC_BRANCH" \
            --title "chore: sync main into develop after ${{ github.ref_name }}" \
            --body "Automated post-release sync failed due to merge conflicts. Resolve manually and merge with a merge commit."
